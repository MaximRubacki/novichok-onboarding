<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Пульт адаптации новичков</title>
<style>
:root{--bg:#f6f7f9;--cd:#fff;--tx:#1b1f24;--mu:#667085;--bd:#e3e6ea;--hi:#d92d20;--me:#dc6803;--lo:#12b76a;--ac:#2557d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--cd:#1d2026;--tx:#e8eaed;--mu:#9aa3af;--bd:#2c313a;--hi:#f97066;--me:#fdb022;--lo:#32d583;--ac:#7aa2ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14161a;--cd:#1d2026;--tx:#e8eaed;--mu:#9aa3af;--bd:#2c313a;--hi:#f97066;--me:#fdb022;--lo:#32d583;--ac:#7aa2ff;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 2px}h2{font-size:15px;margin:0 0 8px}
.mu{color:var(--mu);font-size:13px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:14px 0}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:12px}
.big{font-size:26px;font-weight:700}
.cols{display:grid;gap:12px;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
@media(max-width:800px){.cols{grid-template-columns:minmax(0,1fr)}}.cols>*{min-width:0}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{font-size:12px;color:var(--mu);font-weight:600}
tr.r{cursor:pointer}tr.r:hover,tr.sel{background:color-mix(in srgb,var(--ac) 10%,transparent)}
.b{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600;color:#fff}
.hi{background:var(--hi)}.me{background:var(--me)}.lo{background:var(--lo)}
select,button{font:inherit;padding:6px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--cd);color:var(--tx)}
button.p{background:var(--ac);color:#fff;border-color:var(--ac);cursor:pointer}
ul{margin:4px 0 8px;padding-left:18px}li{margin:3px 0}
.tl li{list-style:none;margin-left:-18px}
pre{white-space:pre-wrap;font:inherit;background:var(--bg);border-radius:8px;padding:10px;margin:8px 0 0}
</style></head><body><main>
<h1>Пульт адаптации новичков</h1>
<div class="mu">Кто из новичков первых 90 дней сейчас в зоне риска и что с этим сделать сегодня. Все данные синтетические.</div>
<div class="grid" id="kpi"></div>
<div class="card" id="td" style="margin-bottom:12px"></div>
<div class="cols">
 <div class="card"><div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px"><h2 style="margin:0">Новички сейчас</h2>
 <select id="f"><option value="">Все роли</option><option>Склад</option><option>Магазин</option><option>Продажи</option><option>Офис</option></select><input id="q" placeholder="ID или имя" size="10" style="font:inherit;padding:6px;border-radius:8px;border:1px solid var(--bd);background:var(--cd);color:var(--tx)"><label class="mu"><input type="checkbox" id="hi"> только высокий</label></div>
 <div class="tw"><table id="t"></table></div></div>
 <div class="card" id="d"><h2>Выберите новичка</h2><div class="mu">Нажмите на строку слева: покажем причины риска, план на 90 дней и подготовим разговор.</div></div>
</div>
<div class="card" id="bt" style="margin-top:12px"></div>
<div class="card" style="margin-top:12px"><button id="ts">Проверить правила</button> <button id="dl" style="margin-left:8px">Скачать данные (CSV)</button><pre id="tr" hidden></pre></div>
</main>
<script>
function mb(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=mb(2026),CP=[3,14,30,60,90],ROLES=["Склад","Магазин","Продажи","Офис"];
const RF={Склад:1.25,Магазин:1.2,Продажи:1,Офис:.7};
const PLAN={
Склад:["Охрана труда, допуск, знакомство с зоной","Первая самостоятельная смена, разбор ошибок приёмки","Выход на норму выработки, обратная связь от бригадира","Освоение второй операции (отбор или упаковка)","Итоги испытательного срока"],
Магазин:["Знакомство с залом, кассой и ассортиментом","Работа на кассе под присмотром, скрипты общения","Самостоятельные смены, разбор жалоб и ошибок","Продажи сопутствующих товаров, цели по смене","Итоги испытательного срока"],
Продажи:["Доступ к CRM, знакомство с каталогом и клиентами","Первые звонки с наставником","Самостоятельная работа с базой, первые сделки","Разбор воронки и работа с возражениями","Итоги испытательного срока"],
Офис:["Доступы, знакомство с командой и процессами","Первая задача с наставником","Самостоятельная задача и разбор","Участие в отчётности и процессах отдела","Итоги испытательного срока"]};
const FN=["Алексей","Мария","Иван","Ольга","Сергей","Анна","Дмитрий","Елена","Павел","Наталья","Артём","Юлия","Максим","Ирина"];
function gen(i,age,role){
 const d=Math.pow(R(),1.5);
 const mentor=R()>.1+.5*d;
 const cps=CP.map(c=>c<=age?R()>.1+.6*d:null);
 const overdue=Math.floor(Math.min(age,30)/30*d*5*R()*1.6);
 const fb=age>=14&&R()<.8?Math.max(1,Math.min(5,Math.round(5-3.5*d+(R()-.5)*2))):null;
 const p={id:"Н-"+String(i).padStart(3,"0"),name:FN[Math.floor(R()*FN.length)]+" "+String.fromCharCode(1040+Math.floor(R()*28))+".",role,age,mentor,cps,overdue,fb,d};
 return p}
function risk(p){
 let s=0;const r=[];
 if(!p.mentor){s+=25;r.push(["Нет наставника","Назначить наставника сегодня"])}
 const miss=p.cps.filter(x=>x===false).length;
 if(miss){s+=Math.min(40,miss*20);r.push(["Пропущено контрольных точек: "+miss,"Провести пропущенную встречу в течение 2 дней"])}
 if(p.overdue>=3){s+=20;r.push(["Просрочено задач адаптации: "+p.overdue,"Разобрать задачи и снять блокеры"])}
 else if(p.overdue>=1){s+=8;r.push(["Есть просроченные задачи адаптации: "+p.overdue,"Напомнить и уточнить сроки"])}
 if(p.fb!==null&&p.fb<=2){s+=25;r.push(["Низкая оценка руководителя: "+p.fb+" из 5","Личный разговор: что мешает работать"])}
 if(p.age>=14&&p.fb===null){s+=10;r.push(["Нет оценки руководителя","Руководителю дать обратную связь по новичку"])}
 if(RF[p.role]>1){s+=5}
 return{s,r,lvl:s>=50?"hi":s>=25?"me":"lo"}}
// история: когорта с известным исходом
const H=[];for(let i=0;i<140;i++){const role=ROLES[Math.floor(R()*4)];const p=gen(i+1,21,role);
 const left=R()<.08+.75*p.d*RF[role]*.6;p.left=left;p.leaveDay=left?10+Math.floor(R()*75):null;H.push(p)}
// активные новички
const A=[];for(let i=0;i<36;i++){const role=ROLES[Math.floor(R()*4)];A.push(gen(200+i,2+Math.floor(R()*86),role))}
A.forEach(p=>p.rk=risk(p));A.sort((a,b)=>b.rk.s-a.rk.s);
const L={hi:"Высокий",me:"Средний",lo:"Низкий"};let sel=null;
function kpi(){const c=l=>A.filter(p=>p.rk.lvl==l).length;
 document.getElementById("kpi").innerHTML=`<div class="card"><div class="mu">Новичков в первые 90 дней</div><div class="big">${A.length}</div></div><div class="card"><div class="mu">Высокий риск</div><div class="big" style="color:var(--hi)">${c("hi")}</div></div><div class="card"><div class="mu">Средний риск</div><div class="big" style="color:var(--me)">${c("me")}</div></div><div class="card"><div class="mu">Без наставника</div><div class="big">${A.filter(p=>!p.mentor).length}</div></div>`}
function tbl(){const f=document.getElementById("f").value,q=document.getElementById("q").value.trim().toLowerCase(),h=document.getElementById("hi").checked;
 document.getElementById("t").innerHTML="<tr><th>ID</th><th>Роль</th><th>День</th><th>Риск</th><th>Балл</th></tr>"+A.filter(p=>(!f||p.role==f)&&(!h||p.rk.lvl=="hi")&&(!q||(p.id+" "+p.name).toLowerCase().includes(q))).map(p=>`<tr class="r${sel==p.id?" sel":""}" data-id="${p.id}"><td>${p.id} ${p.name}</td><td>${p.role}</td><td>${p.age}</td><td><span class="b ${p.rk.lvl}">${L[p.rk.lvl]}</span></td><td>${p.rk.s}</td></tr>`).join("")}
function detail(id){sel=id;const p=A.find(x=>x.id==id);tbl();
 const tl=CP.map((c,i)=>{const st=p.cps[i];const m=st===null?"·":st?"✓":"✗";const col=st===false?"var(--hi)":st?"var(--lo)":"var(--mu)";
  return `<li><b style="color:${col}">${m}</b> День ${c}: ${PLAN[p.role][i]}</li>`}).join("");
 document.getElementById("d").innerHTML=`<h2>${p.id} ${p.name}, ${p.role}, день ${p.age} <span class="b ${p.rk.lvl}">${L[p.rk.lvl]}</span></h2>
 <b>Причины и что делать</b><ul>${p.rk.r.length?p.rk.r.map((x,i)=>{const k=p.id+"|"+i,c=done.has(k);return `<li><label><input type="checkbox" data-k="${k}"${c?" checked":""}> <span style="${c?"text-decoration:line-through;opacity:.6":""}">${x[0]}.</span> <span class="mu">→ ${x[1]}</span></label></li>`}).join(""):"<li>Тревожных сигналов нет. Достаточно планового контакта.</li>"}</ul>
 <b>План на 90 дней</b><ul class="tl">${tl}</ul>
 <button class="p" id="g">Подготовить разговор</button> <button id="cp" style="margin-left:8px">Копировать</button><pre id="o" hidden></pre>`;
 document.getElementById("g").onclick=()=>talk(p);document.getElementById("cp").onclick=copy}
function fallback(p){return `План разговора с руководителем (${p.role}, день ${p.age}):\n`+(p.rk.r.length?p.rk.r.map((x,i)=>(i+1)+". "+x[1]).join("\n"):"1. Плановая встреча, спросить, что идёт хорошо и что мешает")+"\n\nСообщение новичку:\nПривет! Хочу созвониться и спросить, как идёт адаптация, чем могу помочь. Когда удобно поговорить в ближайшие два дня?"}
async function talk(p){const o=document.getElementById("o");o.hidden=false;o.textContent="Готовлю…";
 let s=null;try{s=window.claude&&await claude.use("sample")}catch(e){}
 if(!s){o.textContent=fallback(p)+"\n\n(без ИИ, по шаблону)";return}
 const q=`Ты помощник HR в компании, торгующей спорттоварами. Руководитель должен поговорить с новичком. Роль: ${p.role}, день работы: ${p.age}, период адаптации считаем первыми 90 днями. Наблюдаемые сигналы: ${p.rk.r.map(x=>x[0]).join("; ")||"нет тревожных"}. Напиши по-русски, без выдумывания фактов сверх перечисленных: 1) план разговора руководителя из 4-5 коротких пунктов, 2) короткое тёплое сообщение новичку (2-3 предложения, без обвинений и без упоминания баллов риска). Не упоминай испытательный срок и не придумывай фактов о работе человека. Пол новичка неизвестен: не используй глаголы и прилагательные в мужском или женском роде про него (не «чувствовал», не «готов»), формулируй безлично. Без markdown, без звёздочек, без вступлений.`;
 try{const cl=t=>t.replace(/\*\*/g,"");const r=await s(q,{onText:({text})=>{o.textContent=cl(text)}});o.textContent=cl(r.text)}catch(e){o.textContent=fallback(p)+"\n\n(ИИ недоступен, шаблон)"}}
function bt(){const ok=H.filter(p=>!p.left||p.leaveDay>21);ok.forEach(p=>p.rk=risk(p));
 const hi=ok.filter(p=>p.rk.s>=50),lo=ok.filter(p=>p.rk.s<50),lf=a=>a.filter(p=>p.left).length;
 const pc=(a,b)=>b?Math.round(100*a/b)+"%":"–",all=lf(ok);
 document.getElementById("bt").innerHTML=`<h2>Насколько можно доверять баллу (проверка на синтетической истории)</h2>
 Когорта из ${ok.length} человек, баллы посчитаны по сигналам на 21-й день, исход известен. Ушли раньше 90 дней: среди «высокого риска» <b>${pc(lf(hi),hi.length)}</b> (${hi.length} чел.), среди остальных <b>${pc(lf(lo),lo.length)}</b> (${lo.length} чел.). Правило поймало ${pc(lf(hi),all)} будущих уходов.
 <div class="mu" style="margin-top:6px">Важно: данные сгенерированы по тем же идеям, что и правила, поэтому цифры показывают лишь, что механика работает, а не качество на реальных людях. Перед использованием веса нужно подогнать под реальную выгрузку из Битрикс24.</div>`}
document.getElementById("t").onclick=e=>{const r=e.target.closest("tr.r");if(r)detail(r.dataset.id)};
document.getElementById("f").onchange=tbl;document.getElementById("q").oninput=tbl;document.getElementById("hi").onchange=tbl;
const done=new Set();
function today(){const m={};A.forEach(p=>p.rk.r.forEach((x,i)=>{if(!done.has(p.id+"|"+i))m[x[1]]=(m[x[1]]||0)+1}));const e=Object.entries(m).sort((a,b)=>b[1]-a[1]);document.getElementById("td").innerHTML="<h2>Что сделать сегодня</h2>"+(e.length?"<ul>"+e.map(([k,v])=>`<li><b>${v}</b> × ${k}</li>`).join("")+"</ul>":"Всё сделано.")}
document.getElementById("d").addEventListener("change",e=>{const k=e.target.dataset&&e.target.dataset.k;if(!k)return;e.target.checked?done.add(k):done.delete(k);e.target.nextElementSibling.style.cssText=e.target.checked?"text-decoration:line-through;opacity:.6":"";today()});
async function copy(){const o=document.getElementById("o"),b=document.getElementById("cp");if(o.hidden)return;try{await navigator.clipboard.writeText(o.textContent);b.textContent="Скопировано"}catch(e){const r=document.createRange();r.selectNodeContents(o);const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent="Выделено, скопируйте вручную"}setTimeout(()=>{b.textContent="Копировать"},2500)}
function tests(){const b={mentor:true,cps:[null,null,null,null,null],overdue:0,fb:null,age:5,role:"Офис"};const T=[["чистый новичок офиса: 0 баллов",risk(b).s==0],["нет наставника: 25",risk({...b,mentor:false}).s==25],["две пропущенные точки: 40",risk({...b,cps:[false,false,null,null,null]}).s==40],["склад, 3 просрочки, оценка 2: 50",risk({...b,role:"Склад",overdue:3,fb:2}).s==50],["нет оценки после 14-го дня: 10",risk({...b,age:20}).s==10],["нет наставника, 3 просрочки, оценка 2: высокий",risk({...b,mentor:false,overdue:3,fb:2}).lvl=="hi"]];return T.map(t=>(t[1]?"✓ ":"✗ ")+t[0]).join("\n")}
document.getElementById("ts").onclick=()=>{const t=document.getElementById("tr");t.hidden=false;t.textContent=tests()};
document.getElementById("dl").onclick=async()=>{const t=document.getElementById("tr");let d=null;try{d=window.claude&&await claude.use("downloads")}catch(e){}if(!d){t.hidden=false;t.textContent="Скачивание недоступно в этом окне.";return}const rows=["id,role,day,mentor,missed_checkpoints,overdue_tasks,manager_score,risk_score,level"].concat(A.map(p=>[p.id,p.role,p.age,p.mentor?1:0,p.cps.filter(x=>x===false).length,p.overdue,p.fb===null?"":p.fb,p.rk.s,p.rk.lvl].join(",")));try{await d.save({filename:"novichki.csv",data:rows.join("\n")})}catch(e){}};
kpi();today();tbl();bt();
</script></body></html>
